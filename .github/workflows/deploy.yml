name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required: lets GitHub mint the OIDC token
  contents: read # required: lets the runner check out the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn format:check
      - run: yarn lint
      - run: yarn test

      - run: yarn build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # infra lives outside the yarn workspaces, so it needs its own install
      - run: yarn install --frozen-lockfile
        working-directory: infra

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \ "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value') python3 -c "import sys,base64,json;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ('sub','aud','repository','ref')},indent=2))" "$TOKEN"

      # first point in the job where AWS is reachable at all
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: npx cdk deploy --require-approval never
        working-directory: infra
